format = 4
id = "github.com/MRUIAW/Animated-Mojang"
version = "1.1.0"

[info]
name = "Animated Mojang"
description = "Animated Minecraft title, 3D cave background and menu camera transitions for Bedrock 1.26.60.05 / LeviLamina 26.60 client (26.60.7 or later)."
tags = ["platform:levilamina", "type:mod", "platform:client"]
logo = "https://raw.githubusercontent.com/MRUIAW/Animated-Mojang/refs/heads/main/resources/pack_icon.png"

[[variants.client]]
side = "client"
platform = "win-x64"
preserve = ["mods/AnimatedMojang/config/config.json"]

[variants.client.deps]
"github.com/LiteLDev/LeviLamina#client" = ">=26.60.7 <26.61.0"

[[variants.client.assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/Animated-Mojang-client-windows-x64.zip"]
place = [{ src = "AnimatedMojang/", dest = "mods/AnimatedMojang/" }]
